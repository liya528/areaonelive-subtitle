<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Subtitle</title>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
body{font:16px system-ui,'Noto Sans Thai',sans-serif;max-width:520px;margin:16px auto;padding:0 12px}
label{display:block;margin:12px 0 2px}
select,input[type=text],button{width:100%;padding:8px;font:inherit}
input[type=range]{width:100%}
#go{padding:14px;font-size:18px}
#st,#raw{margin-top:10px;min-height:1.5em}
#raw{background:#eee;color:#222;padding:8px}
</style>
<button id="go">เริ่มฟัง</button>
<div id="st"></div><div id="raw"></div>
<label>ตัวจับเสียง
 <select id="eng"><option value="deepgram">Deepgram (ไม่ต้องใช้บัตร)</option><option value="azure">Azure Speech</option><option value="chrome">Chrome</option></select></label>
<label>ภาษาที่พูด
 <select id="lang"><option value="auto">ไทย + English อัตโนมัติ (Deepgram เท่านั้น)</option><option value="th-TH">ไทย (แปลเป็นอังกฤษ)</option><option value="en-US">English (แปลเป็นไทย)</option></select></label>
<label>รูปแบบซับ
 <select id="mode"><option value="both">ไทย + อังกฤษ</option><option value="orig">ภาษาที่พูดอย่างเดียว</option><option value="trans">คำแปลอย่างเดียว</option></select></label>
<label>คำเฉพาะ ชื่อคน/ชื่องาน คั่นด้วยคอมมา (Azure เท่านั้น)
 <input type="text" id="phr" placeholder="AREAFEST, ก๋วยเตี๋ยวเรือ"></label>
<label>ขนาดตัวอักษร <input type="range" id="font" min="24" max="110"></label>
<label>ระยะจากขอบล่าง <input type="range" id="bottom" min="0" max="400"></label>
<label>URL สำหรับ OBS (Browser Source 1920×1080)
 <input type="text" id="url" readonly onclick="this.select()"></label>
<label><button id="test">ทดสอบซับ (ไม่ใช้ไมค์)</button></label>
<script>
const $=id=>document.getElementById(id),K=location.search,
  post=(u,b)=>fetch(u+K,{method:'POST',body:JSON.stringify(b)}),st=s=>$('st').textContent=s;
$('url').value=location.origin+'/overlay';
// remember choices between visits
['eng','lang','phr'].forEach(k=>{if(localStorage[k])$(k).value=localStorage[k];$(k).addEventListener('input',()=>localStorage[k]=$(k).value)});

const keys=['mode','font','bottom'];let init=false;
new EventSource('/events').onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.type==='settings'&&!init){init=true;keys.forEach(k=>$(k).value=m[k])}
  if(m.type==='terr')st('แปลไม่ได้: '+m.msg);
};
keys.forEach(k=>$(k).oninput=()=>post('/settings',Object.fromEntries(keys.map(k=>[k,k==='mode'?$(k).value:+$(k).value]))));

let rec,az,tok,dg,mr,ms,run=false,session=0;
const on=()=>{run=true;$('go').textContent='หยุดฟัง'};
function start(){
  if($('lang').value==='auto'&&$('eng').value!=='deepgram')return st('โหมดอัตโนมัติใช้ได้กับ Deepgram เท่านั้น');
  ({deepgram:startDeepgram,azure:startAzure,chrome:startChrome})[$('eng').value]()}
function startChrome(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return st('Chrome นี้ไม่รองรับ ให้เลือก Azure แทน');
  rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=true;
  rec.onstart=()=>{session++;st('กำลังฟัง (Chrome)…')};
  rec.onresult=e=>{
    const i=e.results.length-1,r=e.results[i],text=r[0].transcript.trim();
    $('raw').textContent=text;
    post('/caption',{seq:session*10000+i,text,final:r.isFinal,lang:rec.lang});
  };
  rec.onerror=e=>{st('ผิดพลาด: '+e.error);if(/not-allowed/.test(e.error))stop()};
  rec.onend=()=>{if(run)try{rec.start()}catch{}};
  on();rec.start();
}
async function startDeepgram(){
  const k=await (await fetch('/dgkey'+K)).json();
  if(k.error)return st(k.error);
  try{ms=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return st('ใช้ไมค์ไม่ได้: '+e.name)}
  // "auto" = two parallel streams (th + en); per utterance we keep whichever model is more confident
  const v=$('lang').value,langs=v==='auto'?['th','en']:[v.slice(0,2)],LC={th:'th-TH',en:'en-US'};
  session++;let id=0,cutoff=0,cur=null,opened=0;
  const S={},fresh=()=>{langs.forEach(l=>S[l]={base:'',text:'',conf:0,at:0})};fresh();
  const onMsg=(l,m)=>{
    const a=m.channel?.alternatives?.[0],t=a&&a.transcript;
    if(t===undefined)return;
    if(m.start+m.duration<=cutoff+0.02)return;      // belongs to an utterance already closed
    const s=S[l];
    s.text=s.base+(s.base&&t?(l==='th'?'':' '):'')+t;s.conf=t?(a.confidence||0):0;s.at=Date.now();
    if(m.is_final)s.base=s.text;
    const c=langs.filter(x=>S[x].text&&Date.now()-S[x].at<2500);
    if(!c.length){if(m.speech_final)s.base='';return}
    let best=c.reduce((p,x)=>S[x].conf>S[p].conf?x:p);
    if(cur&&c.includes(cur)&&best!==cur&&S[best].conf<S[cur].conf+0.1)best=cur; // avoid flip-flopping
    cur=best;
    const fin=!!m.speech_final&&l===best;
    $('raw').textContent='['+best.toUpperCase()+'] '+S[best].text;
    post('/caption',{seq:session*10000+id,text:S[best].text,final:fin,lang:v==='auto'?LC[best]:v});
    if(fin){cutoff=m.start+m.duration;id++;cur=null;fresh()}
    else if(m.speech_final){s.base='';s.text=''}
  };
  dg=langs.map(l=>{
    const ws=new WebSocket(`wss://api.deepgram.com/v1/listen?model=nova-3&language=${l}&interim_results=true&punctuate=true&endpointing=300`,['token',k.key]);
    ws.onopen=()=>{
      if(++opened<langs.length)return;               // wait until every socket is open so all get the webm header
      st('กำลังฟัง (Deepgram'+(langs.length>1?' ไทย+อังกฤษ':'')+')…');
      mr=new MediaRecorder(ms,{mimeType:'audio/webm;codecs=opus'});
      mr.ondataavailable=e=>{if(e.data.size)dg&&dg.forEach(w=>w.readyState===1&&w.send(e.data))};
      mr.start(250);
    };
    ws.onmessage=e=>onMsg(l,JSON.parse(e.data));
    ws.onerror=()=>st('Deepgram เชื่อมต่อไม่ได้ (เช็คคีย์/เครดิต)');
    ws.onclose=e=>{if(run&&e.code!==1000)st('Deepgram ตัดการเชื่อมต่อ ('+e.code+')')};
    return ws;
  });
  on();
}
async function startAzure(){
  const t=await (await fetch('/token'+K)).json();
  if(t.error)return st(t.error);
  const cfg=SpeechSDK.SpeechConfig.fromAuthorizationToken(t.token,t.region),lang=$('lang').value;
  cfg.speechRecognitionLanguage=lang;
  az=new SpeechSDK.SpeechRecognizer(cfg,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  const pl=SpeechSDK.PhraseListGrammar.fromRecognizer(az);
  $('phr').value.split(',').map(x=>x.trim()).filter(Boolean).forEach(p=>pl.addPhrase(p));
  session++;let id=0;
  const push=(text,final)=>{$('raw').textContent=text;post('/caption',{seq:session*10000+id,text,final,lang})};
  az.recognizing=(s,e)=>push(e.result.text,false);
  az.recognized=(s,e)=>{if(e.result.text)push(e.result.text,true);id++};
  az.canceled=(s,e)=>st('Azure: '+(e.errorDetails||e.reason));
  az.startContinuousRecognitionAsync(()=>st('กำลังฟัง (Azure)…'),e=>st('Azure: '+e));
  tok=setInterval(async()=>{try{az.authorizationToken=(await (await fetch('/token'+K)).json()).token}catch{}},8*60000);
  on();
}
function stop(){
  run=false;rec&&rec.stop();clearInterval(tok);
  try{mr&&mr.state!=='inactive'&&mr.stop()}catch{}
  ms&&ms.getTracks().forEach(x=>x.stop());dg&&dg.forEach(w=>w.close(1000));dg=mr=ms=null;
  if(az){az.stopContinuousRecognitionAsync();az=null}
  $('go').textContent='เริ่มฟัง';st('หยุดแล้ว');
}
$('go').onclick=()=>run?stop():start();
$('lang').onchange=$('eng').onchange=()=>{if(run){stop();setTimeout(start,300)}};

let tid=900000000;
$('test').onclick=()=>{
  const id=++tid*10,p=['สวัสดีค่ะ','สวัสดีค่ะ ยินดีต้อนรับ','สวัสดีค่ะ ยินดีต้อนรับทุกคนสู่งานของเรา'];
  p.forEach((text,i)=>setTimeout(()=>post('/caption',{seq:id,text,final:i==2,lang:'th-TH'}),i*700));
};
</script>
</html>
